# Agora reverse proxy: TLS termination, payload limits, timeouts, rate limits.
#
# For local development generate a self-signed certificate:
#   mkdir -p .agora/certs
#   openssl req -x509 -newkey rsa:2048 -nodes \
#     -keyout .agora/certs/agora.key -out .agora/certs/agora.crt \
#     -days 365 -subj "/CN=localhost"
# Production replaces these with an operator-managed certificate.

limit_req_zone $binary_remote_addr zone=agora_write:10m rate=20r/s;

upstream agora_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/agora.crt;
    ssl_certificate_key /etc/nginx/certs/agora.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 1m;
    client_body_timeout  10s;
    client_header_timeout 10s;
    proxy_read_timeout    60s;
    proxy_send_timeout    60s;

    location / {
        limit_req zone=agora_write burst=40 nodelay;
        proxy_pass http://agora_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }
}
