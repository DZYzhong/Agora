services:
  migrate:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    env_file:
    - ../.env.example
    environment:
      AGORA_ENV: production
      AGORA_DATABASE_URL: postgresql+psycopg://agora:agora@postgres:5432/agora
    command:
    - alembic
    - upgrade
    - head
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    env_file:
    - ../.env.example
    environment:
      AGORA_ENV: production
      AGORA_DATABASE_URL: postgresql+psycopg://agora:agora@postgres:5432/agora
    ports:
    - 8000:8000
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://127.0.0.1:8000/ready
      interval: 10s
      timeout: 5s
      retries: 12
  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    env_file:
    - ../.env.example
    environment:
      AGORA_ENV: production
      AGORA_API_URL: http://api:8000
    ports:
    - 3000:3000
    depends_on:
      api:
        condition: service_healthy
  local-connector:
    build:
      context: ..
      dockerfile: infra/Dockerfile.local-connector
    env_file:
    - ../.env.example
    environment:
      AGORA_ENV: production
      AGORA_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    env_file:
    - ../.env.example
    environment:
      AGORA_ENV: production
      AGORA_DATABASE_URL: postgresql+psycopg://agora:agora@postgres:5432/agora
    command:
    - python
    - -m
    - apps.workers.main
    - outbox-loop
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
  nginx:
    image: nginx:1.27-alpine
    volumes:
    - ./nginx/agora.conf:/etc/nginx/conf.d/default.conf:ro
    - ../.agora/certs:/etc/nginx/certs:ro
    ports:
    - 8080:80
    - 8443:443
    depends_on:
      api:
        condition: service_healthy
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: agora
      POSTGRES_PASSWORD: agora
      POSTGRES_DB: agora
    ports:
    - 5432:5432
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U agora -d agora
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
    - agora-postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
    - 6379:6379
volumes:
  agora-postgres-data: null
