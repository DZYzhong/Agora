services:
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    env_file:
      - ../.env.example
    environment:
      AGORA_ENV: production
      AGORA_DATABASE_URL: postgresql+psycopg://agora:agora@postgres:5432/agora
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/ready"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    env_file:
      - ../.env.example
    environment:
      AGORA_ENV: production
      AGORA_API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  local-connector:
    build:
      context: ..
      dockerfile: infra/Dockerfile.local-connector
    env_file:
      - ../.env.example
    environment:
      AGORA_ENV: production
      AGORA_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: agora
      POSTGRES_PASSWORD: agora
      POSTGRES_DB: agora
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agora -d agora"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - agora-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"

  opensearch:
    image: opensearchproject/opensearch:2
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: "AgoraLocal123!"
    ports:
      - "9200:9200"

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/agora-local
    ports:
      - "7474:7474"
      - "7687:7687"

volumes:
  agora-postgres-data:
