services:
  migrate:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    env_file:
    - ../.env.example
    environment:
      AGORA_ENV: production
      AGORA_DATABASE_URL: postgresql+psycopg://agora:agora@postgres:5432/agora
    command:
    - alembic
    - upgrade
    - head
    depends_on:
      postgres:
        condition: service_healthy
  api:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    env_file:
    - ../.env.example
    environment:
      AGORA_ENV: production
      AGORA_DATABASE_URL: postgresql+psycopg://agora:agora@postgres:5432/agora
      # Real bootstrap secrets come from infra/.env (gitignored); the
      # .env.example placeholders must never reach the container.
      AGORA_BOOTSTRAP_ORG_ID: local-org
      AGORA_BOOTSTRAP_HUMAN_TOKEN: ${AGORA_BOOTSTRAP_HUMAN_TOKEN:?set in infra/.env}
      AGORA_BOOTSTRAP_AGENT_TOKEN: ${AGORA_BOOTSTRAP_AGENT_TOKEN:?set in infra/.env}
      AGORA_BOOTSTRAP_CI_TOKEN: ${AGORA_BOOTSTRAP_CI_TOKEN:?set in infra/.env}
    ports:
    - 8000:8000
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://127.0.0.1:8000/ready
      interval: 10s
      timeout: 5s
      retries: 12
  web:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    env_file:
    - ../.env.example
    environment:
      AGORA_ENV: production
      AGORA_API_URL: http://api:8000
      # The web UI authenticates with the browser cookie session; the static
      # human-token placeholder must not be sent as a Bearer credential.
      AGORA_WEB_HUMAN_TOKEN: ""
      AGORA_WEB_ORIGIN: http://127.0.0.1:3000
    ports:
    - 3000:3000
    depends_on:
      api:
        condition: service_healthy
  # apps.mcp.server is a stdio MCP server: with no interactive stdin it exits
  # immediately (expected). Real AI tools run it on the tool host via
  #   SSL_CERT_FILE=.agora/certs/agora.crt AGORA_API_URL=https://127.0.0.1:8443 \
  #   AGORA_AGENT_TOKEN=<infra/.env> python -m apps.mcp.server
  local-connector:
    restart: "no"
    build:
      context: ..
      dockerfile: infra/Dockerfile.local-connector
    env_file:
    - ../.env.example
    environment:
      AGORA_ENV: production
      AGORA_API_URL: http://api:8000
      # The MCP connector authenticates as the env-bootstrapped agent; share
      # the same real secret the API registered.
      AGORA_AGENT_TOKEN: ${AGORA_BOOTSTRAP_AGENT_TOKEN:?set in infra/.env}
    depends_on:
      api:
        condition: service_healthy
  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    env_file:
    - ../.env.example
    environment:
      AGORA_ENV: production
      AGORA_DATABASE_URL: postgresql+psycopg://agora:agora@postgres:5432/agora
    command:
    - python
    - -m
    - apps.workers.main
    - outbox-loop
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
  nginx:
    restart: unless-stopped
    image: nginx:1.27-alpine
    volumes:
    - ./nginx/agora.conf:/etc/nginx/conf.d/default.conf:ro
    - ../.agora/certs:/etc/nginx/certs:ro
    ports:
    - 8080:80
    - 8443:443
    depends_on:
      api:
        condition: service_healthy
  postgres:
    restart: unless-stopped
    image: postgres:16
    environment:
      POSTGRES_USER: agora
      POSTGRES_PASSWORD: agora
      POSTGRES_DB: agora
    ports:
    - 5432:5432
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U agora -d agora
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
    - agora-postgres-data:/var/lib/postgresql/data
  redis:
    restart: unless-stopped
    image: redis:7
    ports:
    - 6379:6379
  prometheus:
    restart: unless-stopped
    image: prom/prometheus:v2.54.1
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.retention.time=30d
    volumes:
    - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - ./monitoring/agora-alerts.yml:/etc/prometheus/agora-alerts.yml:ro
    - agora-prometheus-data:/prometheus
    ports:
    - 9091:9090
    depends_on:
      api:
        condition: service_healthy
volumes:
  agora-postgres-data: null
  agora-prometheus-data: null
